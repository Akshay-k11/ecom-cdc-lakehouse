# Databricks Asset Bundle: describes the jobs this project deploys.
bundle:
  name: ecom_cdc_lakehouse

variables:
  catalog:
    description: Unity Catalog catalog the pipeline reads from and writes to.
    default: ecom_dev

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      catalog: ecom_prod
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    bronze_load:
      name: bronze_load
      tasks:
        - task_key: load_bronze
          notebook_task:
            notebook_path: notebooks/01_bronze_load.ipynb
            base_parameters:
              catalog: ${var.catalog}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED